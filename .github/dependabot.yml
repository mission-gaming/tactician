version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Keeps the commit-pinned actions in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
