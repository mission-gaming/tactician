name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: no job needs more than read access to the repository.
permissions:
  contents: read

jobs:
  # Fails when a tracked file, its path, or a symbolic link target contains a
  # term from the maintainers' restricted list. The list is a repository
  # secret, so the check is skipped where secrets are withheld (pull requests
  # from forks and from Dependabot). Only paths are printed, never the matched
  # text, and a path that itself matches is counted instead of printed. An
  # unusable list fails the job rather than passing it. The script documents
  # the details and is exercised by tests/Feature/RestrictedTermsCheckTest.php.
  restricted-terms:
    runs-on: ubuntu-latest
    name: Restricted terms

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Check tracked files for restricted terms
      env:
        RESTRICTED_TERMS: ${{ secrets.RESTRICTED_TERMS }}
      run: bash .github/scripts/check-restricted-terms.sh

  # The test and coverage jobs run for every change set, with no path
  # filter: the suite reads documentation as well as code. It executes the
  # code blocks of README.md and docs/USAGE.md
  # (tests/Feature/DocumentationSnippetsTest.php) and checks other Markdown
  # files against the repository, so a documentation-only change can break
  # it. Branch protection waits for the checks these jobs report (PHP 8.3,
  # PHP 8.4, PHP 8.5 and Coverage), so they must never be skipped by a
  # condition; tests/Feature/CiConfigurationTest.php pins that.
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']
      fail-fast: false

    name: PHP ${{ matrix.php-version }}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo, dom, filter, gd, iconv, json, mbstring
        coverage: xdebug

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run CI suite
      run: composer ci

  coverage:
    runs-on: ubuntu-latest
    name: Coverage

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, dom, filter, gd, iconv, json, mbstring
        coverage: xdebug

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.4-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.4-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Prepare build directory
      run: mkdir -p build

    - name: Run tests with coverage
      run: composer test-coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: build/clover.xml
        # Dependabot-triggered runs cannot read Actions secrets, so the token
        # is empty there and the upload may be rejected; that must not fail
        # the dependency update's checks.
        fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}
        flags: php
