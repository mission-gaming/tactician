name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Detect whether the change set contains anything beyond documentation.
  # Docs-only changes (Markdown, docs/, memory-bank/, .clinerules, LICENSE)
  # skip the test and coverage jobs; job-level skips report as "skipped",
  # which satisfies required status checks (unlike workflow-level path
  # filters, which would leave required checks pending).
  changes:
    runs-on: ubuntu-latest
    name: Detect changes
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
    - uses: actions/checkout@v4

    - name: Check for non-documentation changes
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          code:
            - '**'
            - '!**/*.md'
            - '!docs/**'
            - '!memory-bank/**'
            - '!.clinerules'
            - '!LICENSE'

  # Fails when a tracked file, its path, or a symbolic link target contains a
  # term from the maintainers' restricted list. The list is a repository
  # secret, so the check is skipped where secrets are withheld (pull requests
  # from forks and from Dependabot). Only paths are printed, never the matched
  # text, and a path that itself matches is counted instead of printed. An
  # unusable list fails the job rather than passing it. The script documents
  # the details and is exercised by tests/Feature/RestrictedTermsCheckTest.php.
  restricted-terms:
    runs-on: ubuntu-latest
    name: Restricted terms

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Check tracked files for restricted terms
      env:
        RESTRICTED_TERMS: ${{ secrets.RESTRICTED_TERMS }}
      run: bash .github/scripts/check-restricted-terms.sh

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']
      fail-fast: false

    name: PHP ${{ matrix.php-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, xml, ctype, iconv, intl, pdo, dom, filter, gd, iconv, json, mbstring
        coverage: xdebug

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run CI suite
      run: composer ci

  coverage:
    runs-on: ubuntu-latest
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, dom, filter, gd, iconv, json, mbstring
        coverage: xdebug

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-8.4-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-8.4-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Prepare build directory
      run: mkdir -p build

    - name: Run tests with coverage
      run: composer test-coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: build/clover.xml
        fail_ci_if_error: true
        flags: php
